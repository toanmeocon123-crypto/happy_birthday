<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; overflow-x:hidden;
  font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  background:radial-gradient(circle at 50% 30%,#44305f 0,#21182f 42%,#0e0a17 100%);
  color:#fff;
}
.screen{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; transform:scale(.96);
  transition:opacity .7s ease,transform .7s ease;
  padding: 20px;
}
.screen.active{opacity:1;visibility:visible;transform:scale(1)}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.6;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}

/* INTRO */
.intro{text-align:center}
.intro h1{font-size:clamp(26px,5vw,48px);margin-bottom:12px;font-weight:700}
.intro p{color:#ddd;margin-bottom:36px}
.btn{
  border:0;border-radius:999px;padding:14px 28px;
  background:linear-gradient(135deg,#ff82b7,#c75cff);
  color:white;font-weight:bold;font-size:16px;cursor:pointer;
  box-shadow:0 8px 30px #d45cff55; transition:.25s;
  font-family: inherit;
}
.btn:hover{transform:translateY(-3px) scale(1.03)}

.envelope-wrap{text-align:center;cursor:pointer}
.envelope{
  position:relative;width:300px;height:205px;margin:auto;
  filter:drop-shadow(0 20px 25px #0008);
  transition:transform .4s;
}
.envelope:hover{transform:translateY(-7px)}
.env-body{
  position:absolute;inset:20px 0 0;
  background:#f5e7d1;border-radius:6px;overflow:hidden;
}
.env-body:before,.env-body:after{
  content:"";position:absolute;bottom:0;width:0;height:0;
  border-style:solid;
}
.env-body:before{left:0;border-width:0 150px 105px 0;border-color:transparent #e6cda8 transparent transparent}
.env-body:after{right:0;border-width:105px 150px 0 0;border-color:#dec092 transparent transparent transparent}
.flap{
  position:absolute;z-index:3;top:20px;left:0;width:0;height:0;
  border-left:150px solid transparent;border-right:150px solid transparent;
  border-top:105px solid #f8ead5;
  transform-origin:top;transition:transform .9s ease;
}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}

.seal{
  position:absolute;z-index:4;left:50%;top:87px;transform:translateX(-50%);
  width:55px;height:55px;border-radius:50%;background:#e6a15c;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 4px 10px #0003;transition:.5s;color:#fff;
}
.envelope.open .seal{opacity:0;transform:translateX(-50%) scale(.5)}
.envelope-title{margin-top:30px;font-size:24px;font-weight:600}
.hint{margin-top:10px;color:#cdbed9;font-size:14px}

/* LETTER */
.letter-box{
  width:min(680px,90vw);padding:35px 30px;
  background:#fff7e9;color:#4b3440;border-radius:12px;
  box-shadow:0 25px 70px #0008;position:relative;
}
.letter-box h2{text-align:center;color:#b54b72;margin-bottom:20px;font-size:26px;font-weight:700}
.letter-text{font-size:18px;line-height:1.7;white-space:pre-wrap;margin-bottom:20px;}
.letter-box .btn{display:block;margin:20px auto 0}

/* CAKE */
.cake-area{text-align:center}
.cake-area h2{font-size:28px;margin-bottom:10px;font-weight:700}
.cake-area p{color:#d8cde1;margin-bottom:35px}
.cake{position:relative;width:300px;height:270px;margin:auto;cursor:pointer;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.plate{
  position:absolute;bottom:18px;left:15px;width:270px;height:28px;
  background:#eee;border-radius:50%;box-shadow:0 8px 15px #0005
}
.layer{
  position:absolute;left:35px;width:230px;height:75px;border-radius:12px 12px 22px 22px;
  background:linear-gradient(#ff9bbd,#ef6595);box-shadow:inset 0 -10px #d94e80
}
.layer.bottom{bottom:45px}.layer.top{bottom:105px;width:210px;left:45px;background:linear-gradient(#ffd1df,#ff9fbe)}
.cake-decor{
  position:absolute; z-index:6; left:55px; top:112px; width:195px; height:48px; pointer-events:none;
}
.cake-decor:before,.cake-decor:after{
  content:"✦  •  ✦  •  ✦"; position:absolute; white-space:nowrap; font-size:13px;
  letter-spacing:8px; color:#fff7fb; left:5px; top:0;
  text-shadow:0 1px 2px #c94e7a,0 0 7px rgba(255,255,255,.65);
}
.cream{position:absolute;left:0;top:-13px;width:210px;height:32px;background:#fff4f5;border-radius:50%;z-index:2;box-shadow:0 3px 0 rgba(220,180,195,.35)}
.candle{position:absolute;bottom:193px;left:137px;width:25px;height:70px;background:repeating-linear-gradient(45deg,#fff,#fff 8px,#8c6cff 8px,#8c6cff 16px);border-radius:5px;z-index:8;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.flame{position:absolute;z-index:9;left:50%;top:-38px;transform:translateX(-50%);width:22px;height:34px;background:#ffd35c;border-radius:50% 50% 45% 45%;box-shadow:0 0 25px #ffb52e;animation:flame .5s infinite alternate}
@keyframes flame{to{transform:translateX(-50%) scale(.8,.9)}}

/* FINAL SCREEN */
.final{text-align:center; overflow-y:auto; max-height:100vh; padding: 20px;}
.final h1{
  font-size:clamp(32px,7vw,64px);
  background:linear-gradient(90deg,#ffd36a,#ff8fbd,#b77cff,#ffd36a);
  background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradient 4s linear infinite;margin-bottom:10px;font-weight:700
}
@keyframes gradient{to{background-position:300%}}
.final p{font-size:18px;line-height:1.6;max-width:600px;margin:auto;}
.final .cake-small{font-size:60px;margin:5px}

.image-container{
  margin: 15px auto;
  max-width: 380px;
}
.image-container img{
  width: 100%;
  max-height: 280px;
  object-fit: cover;
  border-radius: 16px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  border: 4px solid rgba(255, 255, 255, 0.9);
}

.confetti{position:fixed;top:-20px;width:9px;height:15px;animation:fall 4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.final .again{margin-top:15px}

@media(max-width:500px){
 .envelope{transform:scale(.8)} .letter-box{padding:25px 20px}
 .letter-text{font-size:16px}.cake{transform:scale(.82)}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<section class="screen active" id="s1">
  <div class="intro">
    <div style="font-size:70px;margin-bottom:15px">✨</div>
    <h1>Một điều bất ngờ dành cho bạn</h1>
    <p>Có một món quà nhỏ đang chờ bạn mở...</p>
    <button class="btn" onclick="showScreen('s2')">Bắt đầu 💫</button>
  </div>
</section>

<section class="screen" id="s2">
  <div class="envelope-wrap" onclick="openEnvelope()">
    <div class="envelope" id="envelope">
      <div class="env-body"></div>
      <div class="flap"></div>
      <div class="seal">✨</div>
    </div>
    <div class="envelope-title"> Bạn có một lá thư!!!</div>
    <div class="hint">Nhấn vào phong thư để mở</div>
  </div>
</section>

<section class="screen" id="s3">
  <div class="letter-box">
    <h2>Gửi bạn nữ xinh thí 🎆</h2>
    <div class="letter-text" id="letterText"></div>
    <button class="btn" id="letterBtn" style="display:none" onclick="showScreen('s4')">Tiếp tục →</button>
  </div>
</section>

<section class="screen" id="s4">
  <div class="cake-area">
    <h2>Và đây là món quà tiếp theo... 🎁</h2>
    <p>Hãy chạm vào chiếc bánh nhé!</p>
    <div class="cake" onclick="celebrate()">
      <div class="candle"><div class="flame"></div></div>
      <div class="layer top"><div class="cream"></div></div>
      <div class="layer bottom"></div>
      <div class="cake-decor"></div>
      <div class="plate"></div>
    </div>
  </div>
</section>

<section class="screen final" id="s5">
  <div>
    <div class="cake-small">🎂</div>
    <h1>HAPPY BIRTHDAY!</h1>
    
    <div class="image-container">
      <img id="surpriseImg" src="" alt="Ảnh kỷ niệm">
    </div>

    <p id="finalText"></p>
    <button class="btn again" onclick="location.reload()">Xem lại từ đầu ↻</button>
  </div>
</section>

<script>

const PERSON_IMAGE_URL = "Ham.jpg"; 

const letter = `Dù Linh xàm sỡ mình sáng nay, nhưng cũng giúp đỡ mình rất nhiều.
Mình ghét Linh vl=)))

Hãy luôn vui vẻ, tự tin làm điều mình thích nhé 🎆`.normalize('NFC');

const finalMessage = `Chúc Linh có một sinh nhật thật vui vẻ và một tuổi mới thật rực rỡ! 
Mong mọi điều tốt đẹp sẽ đến với Linh, hôm nay và cả những ngày sau nữa. ✨`.normalize('NFC');

for(let i=0;i<70;i++){
  const s=document.createElement('span');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*2+'s';document.getElementById('stars').appendChild(s);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openEnvelope(){
  const env=document.getElementById('envelope');
  env.classList.add('open');
  setTimeout(()=>{
    showScreen('s3'); 
    typeText('letterText', letter, 25, ()=>{
      document.getElementById('letterBtn').style.display='block';
    });
  }, 650);
}

function typeText(id, text, speed, done){
  const el = document.getElementById(id);
  el.textContent = '';
  
  const segmenter = Intl.Segmenter ? new Intl.Segmenter('vi', { granularity: 'grapheme' }) : null;
  const chars = segmenter ? Array.from(segmenter.segment(text), s => s.segment) : Array.from(text);
  
  let i = 0;
  const timer = setInterval(()=>{
    el.textContent += chars[i++];
    if(i >= chars.length){
      clearInterval(timer);
      if(done) done();
    }
  }, speed);
}

function celebrate(){
  document.getElementById('surpriseImg').src = PERSON_IMAGE_URL;
  showScreen('s5');
  typeText('finalText', finalMessage, 20);

  for(let i=0;i<100;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.animationDelay=Math.random()*1.5+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.background=`hsl(${Math.random()*360},80%,65%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}
</script>
</body>
</html>
